name: Binance Paper Training
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train and backtest on live public Binance data
        run: python trading_lab/train.py
      - name: Commit latest research snapshot
        run: |
          git config user.name 'binance-paper-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add trading_lab/latest_backtest.json
          git diff --cached --quiet || git commit -m 'chore: update Binance paper-training snapshot'
          git push
